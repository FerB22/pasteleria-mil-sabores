<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de productos — Pastelería Mil Sabores</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo">Mil Sabores <span>Pastelería</span></a>
      <button class="hamburger" aria-label="Abrir menú de navegación">Menú</button>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="productos.html" class="active">Productos</a></li>
          <li><a href="blogs.html"><em>Blog</em></a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="login.html">Ingresar</a></li>
          <li><a href="registro.html">Registro</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="carrito.html" class="cart-btn">Carrito <span class="cart-badge">0</span></a>
        <a href="admin/index.html" class="admin-pill">Administración</a>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="section-header">
      <h1 class="section-title">Catálogo de especialidades</h1>
      <p class="section-subtitle">Seleccione una categoría o realice una búsqueda directa.</p>
    </div>

    <div style="background: #fff; padding: 20px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center;">
      <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="category-filters">
        <button class="btn btn-sm btn-primary filter-btn" data-cat="Todas">Todas</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Tortas Cuadradas">Tortas cuadradas</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Tortas Circulares">Tortas circulares</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Postres Individuales">Postres individuales</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Productos Sin Azúcar">Sin azúcar</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Pastelería Tradicional">Tradicional</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Productos Sin Gluten">Sin gluten</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Productos Vegana">Vegana</button>
        <button class="btn btn-sm btn-outline filter-btn" data-cat="Tortas Especiales">Especiales</button>
      </div>
      <div style="min-width: 250px;">
        <input type="text" id="search-input" placeholder="Buscar por nombre o código..." class="form-control" style="padding: 8px 12px;">
      </div>
    </div>

    <div id="products-grid" class="grid-products"></div>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Pastelería Mil Sabores SpA. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      loadProducts();
      let currentCategory = "Todas";
      const filterBtns = document.querySelectorAll(".filter-btn");
      const searchInput = document.getElementById("search-input");

      filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          filterBtns.forEach(b => {
            b.classList.remove("btn-primary");
            b.classList.add("btn-outline");
          });
          btn.classList.add("btn-primary");
          btn.classList.remove("btn-outline");
          currentCategory = btn.getAttribute("data-cat");
          loadProducts(currentCategory, searchInput.value);
        });
      });

      searchInput.addEventListener("input", (e) => {
        loadProducts(currentCategory, e.target.value);
      });
    });
  </script>
</body>
</html>
